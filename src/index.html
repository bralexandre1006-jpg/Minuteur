<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minuteur</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

  <main class="shell" id="shell" data-status="idle">
    <header class="titlebar" data-tauri-drag-region>
      <button class="icon-btn" id="btnSound" title="Son de l'alarme" aria-label="Son de l'alarme">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <span class="title" data-tauri-drag-region>Minuteur</span>
      <div class="lights">
        <button class="light min" id="btnMin" title="Réduire" aria-label="Réduire"></button>
        <button class="light pin" id="btnPin" title="Toujours au premier plan" aria-label="Toujours au premier plan"></button>
        <button class="light close" id="btnClose" title="Fermer" aria-label="Fermer"></button>
      </div>
    </header>

    <section class="dial">
      <svg class="ring" viewBox="0 0 260 260" aria-hidden="true">
        <circle class="track" cx="130" cy="130" r="118"/>
        <circle class="prog" id="prog" cx="130" cy="130" r="118"/>
      </svg>
      <div class="readout">
        <div class="time" id="time" aria-live="off">
          <div class="unit" data-u="h">
            <button class="step" data-k="h" data-dir="1" aria-label="Plus de heures"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
            <span class="seg" data-k="h">00</span>
            <button class="step" data-k="h" data-dir="-1" aria-label="Moins de heures"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          </div>
          <span class="colon" data-c="h">:</span>
          <div class="unit" data-u="m">
            <button class="step" data-k="m" data-dir="1" aria-label="Plus de minutes"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
            <span class="seg" data-k="m">05</span>
            <button class="step" data-k="m" data-dir="-1" aria-label="Moins de minutes"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          </div>
          <span class="colon">:</span>
          <div class="unit" data-u="s">
            <button class="step" data-k="s" data-dir="1" aria-label="Plus de secondes"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
            <span class="seg" data-k="s">00</span>
            <button class="step" data-k="s" data-dir="-1" aria-label="Moins de secondes"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          </div>
        </div>
        <div class="sub" id="sub"></div>
      </div>
    </section>

    <div class="field glass">
      <input id="label" placeholder="Nom du minuteur" maxlength="40" spellcheck="false" autocomplete="off">
    </div>

    <div class="chips-area">
      <div class="chips" id="presets"></div>
      <div class="chips extras" id="extras">
        <button class="chip glass" data-add="60">+1 min</button>
        <button class="chip glass" data-add="300">+5 min</button>
        <button class="chip glass" data-add="600">+10 min</button>
      </div>
    </div>

    <footer class="controls">
      <button class="round glass" id="btnReset">Annuler</button>
      <button class="round glass primary" id="btnMain">Démarrer</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
