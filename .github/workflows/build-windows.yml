name: Build Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Minuteur-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publier l'installeur dans une Release (une par version, jamais remplacée)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER existe déjà : rien n'est remplacé. Incrémente la version pour publier."
            exit 0
          fi
          gh release create "v$VER" src-tauri/target/release/bundle/nsis/*.exe \
            --target "$GITHUB_SHA" --title "Minuteur $VER" --notes "Installeur Windows : lance le .exe, coche « Créer un raccourci sur le bureau » à la fin."
